# =============================================================
# Pyng — CI Quality Gates
# =============================================================
# Chạy tự động khi push lên main.
# Chặn code lỗi trước khi deploy production.
#
# Gates:
#   1. Syntax check — py_compile trên tất cả Python files
#   2. Import test  — verify tất cả modules load thành công
#   3. Linting      — ruff check (nếu có config)
# =============================================================

name: CI

on:
  push:
    branches: [main]
    paths:
      # Chỉ chạy khi có thay đổi code, không chạy khi chỉ sửa docs
      - "api/**"
      - "bot/**"
      - "config/**"
      - "db/**"
      - "services/**"
      - "requirements.txt"

  # Cho phép trigger manual để test
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Gate 1: Syntax Check ──────────────────────────────
      - name: "🚧 Gate 1: Syntax check"
        run: |
          echo "Checking Python syntax..."
          ERRORS=0
          for file in $(find api/ bot/ config/ db/ services/ -name "*.py" 2>/dev/null); do
            if ! python -m py_compile "$file" 2>/dev/null; then
              echo "❌ Syntax error: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "❌ Found $ERRORS files with syntax errors"
            exit 1
          fi
          echo "✅ All Python files pass syntax check"

      # ── Gate 2: Import Test ───────────────────────────────
      - name: "🚧 Gate 2: Import test"
        env:
          # Dummy env vars để import không crash (modules đọc env khi load)
          TELEGRAM_BOT_TOKEN: "dummy-token-for-ci"
          SUPABASE_URL: "https://dummy.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-key-for-ci"
          CRON_SECRET: "dummy-cron-secret"
          JWT_SECRET: "dummy-jwt-secret"
          ADMIN_TELEGRAM_IDS: "123456789"
        run: |
          echo "Testing module imports..."
          python -c "
          try:
              from bot.app import create_bot
              print('✅ bot.app OK')
          except Exception as e:
              print(f'❌ bot.app FAILED: {e}')
              exit(1)

          try:
              from services.user_service import register_user
              print('✅ services.user_service OK')
          except Exception as e:
              print(f'❌ services.user_service FAILED: {e}')
              exit(1)

          try:
              from services.checkin_service import checkin
              print('✅ services.checkin_service OK')
          except Exception as e:
              print(f'❌ services.checkin_service FAILED: {e}')
              exit(1)

          try:
              from services.office_service import get_office
              print('✅ services.office_service OK')
          except Exception as e:
              print(f'❌ services.office_service FAILED: {e}')
              exit(1)

          try:
              from services.qr_service import generate_qr_session
              print('✅ services.qr_service OK')
          except Exception as e:
              print(f'❌ services.qr_service FAILED: {e}')
              exit(1)

          try:
              from services.nfc_service import validate_nfc_token
              print('✅ services.nfc_service OK')
          except Exception as e:
              print(f'❌ services.nfc_service FAILED: {e}')
              exit(1)

          print('✅ All module imports passed')
          "

      # ── Summary ───────────────────────────────────────────
      - name: "✅ All gates passed"
        run: |
          echo "================================================"
          echo "✅ CI Quality Gates: ALL PASSED"
          echo "  Gate 1: Syntax check ✅"
          echo "  Gate 2: Import test  ✅"
          echo "================================================"
          echo "Safe to deploy! 🚀"
