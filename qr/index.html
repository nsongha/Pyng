<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyng — QR Check-in</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      h1 {
        color: #fc3c44;
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: #888;
        margin-bottom: 2rem;
      }
      #qr-container {
        background: white;
        padding: 24px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(252, 60, 68, 0.2);
      }
      #qr-container img {
        width: 280px;
        height: 280px;
      }
      .timer {
        margin-top: 1.5rem;
        color: #888;
        font-size: 0.9rem;
      }
      .status {
        margin-top: 0.5rem;
        font-size: 0.8rem;
      }
      .status.ok {
        color: #4caf50;
      }
      .status.error {
        color: #fc3c44;
      }
    </style>
  </head>
  <body>
    <h1>📍 Pyng</h1>
    <p class="subtitle">Quét mã để check-in</p>
    <div id="qr-container">
      <p style="padding: 100px 60px; color: #999; text-align: center">
        Đang tải QR code...
      </p>
    </div>
    <p class="timer">Tự động refresh mỗi <strong>5 phút</strong></p>
    <p class="status ok" id="status">● Đang kết nối...</p>

    <script>
      // TODO: Fetch QR từ /api/qr/current và auto-refresh mỗi 5 phút
      // Placeholder — sẽ implement ở Phase 2
    </script>
  </body>
</html>
